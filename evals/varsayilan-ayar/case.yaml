schema_version: "1.0"
name: varsayilan-ayar
description: >
  Proje düzeyindeki .claude/konsey.json varsayılanı (tema klasik, mod hizli) varsayılan kurtlar temasını ezer; istekte tema/mod yokken uygulanır.
  Ayar dosyasını scaffold.sh yazar; suite --scaffold ile çalıştırılmalı.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "konseyi topla: Küçük bir yazılım ekibi iç yazışma için Slack mi kullanmalı yoksa Discord mu?"
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Read, Glob, Grep]
graders:
  - name: ayar-okundu
    type: tool_used
    tool: Read
    input_match: '\.claude/konsey\.json'
  - name: klasik-temasi
    type: regex
    pattern: '═\s*\n\s*KONSEY\s*\n[\s\S]*⚔ ELEŞTİRMEN[\s\S]*KONSEY BAŞKANI'
  - name: kurtlar-yok
    type: regex
    match: not_contains
    pattern: 'KURTLAR KONSEYİ|TESTERE NECMİ'
  - name: hizli-mod-alt-ajansiz
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
